const REPORT_THRESHOLD = 10;

];
function getTodayString() {

  const today = new Date();

  return today
    .toISOString()
    .split('T')[0];

}
function openCompareCard() {

  const hanzi =
    document.getElementById(
      'popupHanzi'
    ).innerText;

  const targetIndex =
    data.findIndex(
      x => x.hanzi === hanzi
    );

  if (targetIndex >= 0) {

    cardHistory.push(
      currentIndex
    );

    document.getElementById(
      'comparePopup'
    ).style.display =
      'none';

    showCard(targetIndex);

  }

}
function addDaysToToday(days) {

  const date = new Date();

  date.setDate(
    date.getDate() + days
  );

  return date
    .toISOString()
    .split('T')[0];

}
function getPolyphonicInfo(card) {

  if (!card || !card.hanzi) {
    return null;
  }

  const matches =
    data.filter(
      x => x.hanzi === card.hanzi
    );

  if (matches.length <= 1) {
    return null;
  }

  const currentIndex =
    matches.findIndex(
      x => x.id === card.id
    );

  return {
    current:
      currentIndex + 1,
    total:
      matches.length
  };

}

function shouldShowSeenReminder(card) {

  if (!card || !card.id) {
    return false;
  }

  const seen =
    seenCount[card.id] || 0;

  const state =
    memoryState[card.id];

  return (
    seen >= REPORT_THRESHOLD &&
    !state
  );

}
function handleSeenReminder() {

  alert(
    'Mark Know / Hard / Review\n' +
    'to speed up your progress.'
  );

}
function getFavoriteCards() {

  return data.filter(card =>
    favoriteState[card.id]

    function randomCard() {

  closeSettings();

  const weights = {
    hard: 45,
    unknown: 35,
    review: 15,
    know: 5
  };

  const pools = {
    hard: [],
    unknown: [],
    review: [],
    know: []
  };

  data.forEach((card, index) => {

    const state = memoryState[card.id];

    if (state === 'hard') {

      pools.hard.push(index);

    } else if (state === 'review') {

      pools.review.push(index);

    } else if (state === 'know') {

      pools.know.push(index);

    } else {

      pools.unknown.push(index);

    }

  });

  const availableGroups = [];

  Object.keys(pools).forEach(group => {

    if (pools[group].length > 0) {

      availableGroups.push({
        name: group,
        weight: weights[group]
      });

    }

  });

  if (availableGroups.length === 0) {

    alert('No cards available.');
    return;

  }

  const totalWeight =
    availableGroups.reduce(
      (sum, group) => sum + group.weight,
      0
    );

  let randomWeight =
    Math.random() * totalWeight;

  let selectedGroup =
    availableGroups[0].name;

  for (const group of availableGroups) {

    randomWeight -= group.weight;

    if (randomWeight <= 0) {

      selectedGroup = group.name;

      break;

    }

  }

  const pool = pools[selectedGroup];

  const randomIndex =
    pool[Math.floor(Math.random() * pool.length)];

  cardHistory.push(currentIndex);

  showCard(randomIndex);

}

  if (swipeDistance > 50) {

    goPreviousCard();

  }

}
loadData();

setTimeout(() => {

  const reveal =
    document.getElementById('showRevealBtn');
  const next =
    document.getElementById('showNextBtn');
  const previous =
    document.getElementById('showPreviousBtn');
  const hint =
    document.getElementById('showHintBtn');
  const speak =
    document.getElementById('showSpeakBtn');

  if (reveal)
    reveal.checked =
      uiSettings.showReveal;

  if (next)
    next.checked =
      uiSettings.showNext;

  if (previous)
    previous.checked =
      uiSettings.showPrevious;

  if (hint)
    hint.checked =
      uiSettings.showHint;

  if (speak)
    speak.checked =
      uiSettings.showSpeak;

  applyUISettings();

}, 100);
  </script>
</body>
</html>
